const T=THREE, scene=new T.Scene();scene.background=new T.Color(0x02060b);const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.1,1000);camera.position.set(14,15,-62);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.outputEncoding=T.sRGBEncoding;document.body.append(renderer.domElement);const orbit=new T.OrbitControls(camera,renderer.domElement);orbit.target.set(-3,8,-108);orbit.enableDamping=true;const whale=PenthouseWhale.create(T,{});scene.add(whale.group);const clock=new T.Clock();let time=0,playing=true;document.getElementById('motion').onclick=()=>{playing=!playing;document.getElementById('motion').textContent=playing?'Pause motion':'Resume motion'};new T.GLTFLoader().load('../../shared/assets/models/city/holographic-whale.glb',g=>{whale.load(g);document.getElementById('status').textContent='8 anatomical surfaces · 320 inner particles';});function draw(){requestAnimationFrame(draw);let d=clock.getDelta();if(playing)time+=d;whale.update(time);const p=whale.getLightState().position;orbit.target.set(p[0],p[1],p[2]);orbit.update();renderer.render(scene,camera)}draw();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
